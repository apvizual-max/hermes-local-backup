auth_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

storage:
  trace:
    backend: s3
    s3:
      endpoint: host.docker.internal:9000
      bucket: tempo
      access_key: minioadmin
      secret_key: minioadmin
      insecure: true
