[project]
name = "session-replay-mcp"
version = "0.1.0"
description = "Session Replay MCP Server - debugging and audit with deterministic replay"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
