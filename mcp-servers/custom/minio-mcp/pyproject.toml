[project]
name = "minio-mcp"
version = "0.1.0"
description = "MinIO MCP Server - S3-compatible object storage"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "boto3>=1.34",
    "botocore>=1.34",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
