[project]
name = "optimus-orchestrator-mcp"
version = "0.1.0"
description = "Optimus Prime Orchestration MCP Server - exposes cognitive architecture primitives"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
