[project]
name = "postgresql-mcp"
version = "0.1.0"
description = "PostgreSQL MCP Server - database management and queries"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
